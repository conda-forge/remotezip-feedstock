{% set name = "remotezip" %}
{% set version = "0.12.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/remotezip-{{ version }}.tar.gz
  sha256: 54a9d93bfe015ec79aa3a3869f0666360aa8d02626c16956e65ca7f33274b4fa

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  entry_points:
    - remotezip = remotezip:main

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - requests

test:
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
    - remotezip --help
  imports:
    - remotezip

about:
  home: https://github.com/gtsystem/python-remotezip
  summary: Access zip file content hosted remotely without downloading the full file.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jhkennedy
